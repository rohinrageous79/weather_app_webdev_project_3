<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pp8.css">
    <title> Weather App </title>
</head>
<body>
    <div class="base">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button> <img src="https://static.vecteezy.com/system/resources/thumbnails/019/157/262/small/search-icon-simple-style-web-searching-background-symbol-search-brand-logo-design-element-search-t-shirt-printing-for-sticker-free-vector.jpg"></button>
        </div>

        <div class="error">
            <p> Invalid City Name </p>
        </div>

        <div class="weather">
            <img src="https://cdn-icons-png.flaticon.com/512/7038/7038403.png" class="weather-icon">
            <h1 class="temp"> 22°C </h1>
            <h2 class="city"> London </h2>

            <div class="details">
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/4148/4148388.png">
                    <div>
                        <p class="humidity"> 50%</p>
                        <p> Humidity </p>
                    </div>
                </div>
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/10461/10461595.png">
                    <div>
                        <p class="wind"> 15 km/h </p>
                        <p> Wind Speed </p>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="pp8.js"> </script>
</html>
